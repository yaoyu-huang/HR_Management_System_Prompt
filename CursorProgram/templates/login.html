{% extends "base.html" %}
{% block content %}
<div class="card max-w-xl mx-auto mt-10">
    <h2>管理员登录</h2>
    <p class="muted mb-6">请输入账号密码进入 HR 管理后台。</p>
    <form method="post">
        <div class="mb-4">
            <label>用户名</label><br>
            <input type="text" name="username" placeholder="admin" required>
        </div>
        <div class="mb-4">
            <label>密码</label><br>
            <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="mb-5 flex items-center gap-2">
            <input id="remember_login" type="checkbox" name="remember_login">
            <label for="remember_login" class="mb-0">记住登录（30天）</label>
        </div>
        <button type="submit">登录系统</button>
    </form>
    <p class="muted mt-4">演示账号：admin / Admin@123</p>
</div>
{% endblock %}
